services:
  - type: web_service
    name: Ifugao BMI Backend
    env: python
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn bmi_monitor.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: bmi_monitor.settings
  - type: static_site
    name: Ifugao BMI Frontend
    branch: main
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://YOUR_BACKEND_SERVICE.onrender.com/api
