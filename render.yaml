services:
  - type: web
    name: Ifugao BMI Frontend
    repo: https://github.com/elgium2026/ippo-bmi-monitoring-system
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: Ifugao BMI Backend
    repo: https://github.com/elgium2026/ippo-bmi-monitoring-system
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    branch: main
    plan: free
    dockerCommand: "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn bmi_monitor.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: bmi_monitor.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ifugao-bmi-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

databases:
  - name: ifugao-bmi-db
    plan: free
    databaseName: ifugao_bmi_prod
    user: ifugao_bmi_user
    region: singapore
