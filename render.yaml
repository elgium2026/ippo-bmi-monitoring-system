services:
  - type: web
    name: Ifugao BMI Backend
    runtime: python-3.11
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn bmi_monitor.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: bmi_monitor.settings
